plugins:
  - id: voice
    source: github:branchkit/branchkit-plugin-voice
    description: "Core voice commands, phonetic alphabet, calibration, dictation timing."
    categories: [input, accessibility]
    tier: first-party
    collections: [alphabet, direction, number, voice_commands]

  - id: tiling
    source: github:branchkit/branchkit-plugin-tiling
    description: "Tree-based tiling window manager with voice and keybind control."
    categories: [windows, productivity]
    tier: first-party

  - id: browser
    source: github:branchkit/branchkit-plugin-browser
    description: "Bridge between BranchKit and browser extensions. Routes voice commands to page elements."
    categories: [browser, navigation]
    tier: first-party

  - id: keyboard
    source: github:branchkit/branchkit-plugin-keyboard
    description: "Global hotkey capture, keybind registry, and input simulation."
    categories: [input]
    tier: first-party
    collections: [keybinds, keys, layout_characters, modifiers]

  - id: system
    source: github:branchkit/branchkit-plugin-system
    description: "Application registry, app switching HUD, audio control, and system settings."
    categories: [system]
    tier: first-party
    collections: [app_traits, apps, audio_inputs, audio_outputs]

  - id: windows
    source: github:branchkit/branchkit-plugin-windows
    description: "Native window management — snap, move to space, switch desktops, browser tab operations."
    categories: [windows]
    tier: first-party

  - id: scripts
    source: github:branchkit/branchkit-plugin-scripts
    description: "User scripts host — single-file voice commands, event handlers, and timers in Lua, JavaScript, TypeScript, or Python."
    categories: [scripting, productivity]
    tier: first-party

  - id: speech
    source: github:branchkit/branchkit-plugin-speech
    description: "Spoken feedback — reads what plugins report through output.state aloud: problems, modes and their choices, and, for a person who cannot see the screen, what happened."
    categories: [accessibility]
    tier: first-party

  - id: basetypes
    source: github:DrewBradfordXYZ/branchkit-plugin-basetypes
    description: "Basetypes integration with BranchKit."
    categories: [productivity, quickbase]
    tier: approved
