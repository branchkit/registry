# BranchKit Plugin Conformance
#
# Copy this workflow into your plugin repo at .github/workflows/conformance.yml
# It runs on every release tag and reports conformance status.
#
# The branchkit-cli install command checks this status and shows it to users.

name: BranchKit Conformance

on:
  push:
    tags:
      - 'v*'

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download branchkit-cli
        run: |
          CLI_VERSION="latest"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
          if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')

          DOWNLOAD_URL="https://github.com/branchkit/branchkit-cli/releases/${CLI_VERSION}/download/branchkit-cli-${OS}-${ARCH}.tar.gz"
          echo "Downloading branchkit-cli from ${DOWNLOAD_URL}..."
          curl -fsSL "$DOWNLOAD_URL" -o /tmp/branchkit-cli.tar.gz
          tar -xzf /tmp/branchkit-cli.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/branchkit-cli

      - name: Set up Go
        if: hashFiles('src/go.mod') != '' || hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Bun
        if: hashFiles('package.json') != ''
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f "src/go.mod" ]; then
            cd src && go mod download
          elif [ -f "package.json" ]; then
            bun install
          fi

      - name: Run conformance checks
        run: branchkit-cli dev test . --static-only
