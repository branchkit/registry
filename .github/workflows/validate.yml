name: Validate Catalog

on:
  pull_request:
    paths:
      - 'catalog.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-yaml

      - name: Validate catalog.yaml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          python3 - <<'PYTHON'
          import yaml
          import sys
          import json
          import subprocess
          import re

          def levenshtein(s1, s2):
              if len(s1) < len(s2):
                  return levenshtein(s2, s1)
              if len(s2) == 0:
                  return len(s1)
              prev = range(len(s2) + 1)
              for i, c1 in enumerate(s1):
                  curr = [i + 1]
                  for j, c2 in enumerate(s2):
                      curr.append(min(prev[j + 1] + 1, curr[j] + 1, prev[j] + (c1 != c2)))
                  prev = curr
              return prev[-1]

          with open("catalog.yaml") as f:
              cat = yaml.safe_load(f)

          if not cat or "plugins" not in cat:
              print("error: catalog.yaml must have a 'plugins' key")
              sys.exit(1)

          errors = 0
          warnings = 0
          ids_seen = set()
          sources_seen = set()
          valid_tiers = {"first-party", "approved", "community"}
          id_pattern = re.compile(r"^[a-z0-9-]+$")
          source_pattern = re.compile(r"^github:[a-zA-Z0-9_.-]+/branchkit-plugin-[a-zA-Z0-9_.-]+$")

          for entry in cat["plugins"]:
              plugin_id = entry.get("id", "")

              # Check ID format
              if not id_pattern.match(plugin_id):
                  print(f"error: invalid plugin ID '{plugin_id}' (must be lowercase letters, digits, hyphens)")
                  errors += 1
                  continue

              # Check duplicate IDs
              if plugin_id in ids_seen:
                  print(f"error: duplicate plugin ID '{plugin_id}'")
                  errors += 1
                  continue
              ids_seen.add(plugin_id)

              # Check required fields
              source = entry.get("source", "")
              desc = entry.get("description", "")
              tier = entry.get("tier", "")

              if not source:
                  print(f"error: plugin '{plugin_id}': missing 'source' field")
                  errors += 1
              if not desc:
                  print(f"error: plugin '{plugin_id}': missing 'description' field")
                  errors += 1
              if tier not in valid_tiers:
                  print(f"error: plugin '{plugin_id}': invalid tier '{tier}' (must be one of: {', '.join(sorted(valid_tiers))})")
                  errors += 1

              # Check source format: github:owner/branchkit-plugin-*
              if source and not source_pattern.match(source):
                  print(f"error: plugin '{plugin_id}': source '{source}' must match github:owner/branchkit-plugin-* format")
                  errors += 1
                  continue

              # Check duplicate sources
              if source in sources_seen:
                  print(f"error: plugin '{plugin_id}': duplicate source '{source}'")
                  errors += 1
              sources_seen.add(source)

              # Verify plugin ID matches repo name convention
              if source:
                  repo_name = source.split("/")[-1]
                  expected_id = repo_name.removeprefix("branchkit-plugin-")
                  if plugin_id != expected_id:
                      print(f"error: plugin '{plugin_id}': ID must match repo name (repo 'branchkit-plugin-{expected_id}' expects id '{expected_id}')")
                      errors += 1

              # Check GitHub repo exists
              if source:
                  owner_repo = source.removeprefix("github:")
                  result = subprocess.run(
                      ["gh", "api", f"repos/{owner_repo}", "--silent"],
                      capture_output=True
                  )
                  if result.returncode != 0:
                      print(f"error: plugin '{plugin_id}': repo '{owner_repo}' not found on GitHub")
                      errors += 1
                  else:
                      print(f"pass: plugin '{plugin_id}': {owner_repo} exists")

              # Fetch and validate plugin.json from repo
              if source and errors == 0:
                  owner_repo = source.removeprefix("github:")
                  result = subprocess.run(
                      ["gh", "api", f"repos/{owner_repo}/contents/plugin.json",
                       "--header", "Accept: application/vnd.github.raw+json"],
                      capture_output=True, text=True
                  )
                  if result.returncode != 0:
                      print(f"error: plugin '{plugin_id}': could not fetch plugin.json from {owner_repo}")
                      errors += 1
                  else:
                      try:
                          manifest = json.loads(result.stdout)
                          manifest_id = manifest.get("id", "")
                          if manifest_id != plugin_id:
                              print(f"error: plugin '{plugin_id}': plugin.json has id '{manifest_id}', expected '{plugin_id}'")
                              errors += 1
                          else:
                              print(f"pass: plugin '{plugin_id}': plugin.json ID matches")
                      except json.JSONDecodeError:
                          print(f"error: plugin '{plugin_id}': plugin.json is not valid JSON")
                          errors += 1

          # Typosquatting check: Levenshtein distance between all pairs of IDs
          all_ids = list(ids_seen)
          for i, id1 in enumerate(all_ids):
              for id2 in all_ids[i+1:]:
                  dist = levenshtein(id1, id2)
                  max_len = max(len(id1), len(id2))
                  if dist <= 2 and max_len > 3:
                      print(f"warning: typosquat risk: '{id1}' and '{id2}' (distance={dist}) — requires manual review")
                      warnings += 1

          print(f"\nValidated {len(cat['plugins'])} plugins: {errors} errors, {warnings} warnings")

          if errors > 0:
              sys.exit(1)
          if warnings > 0:
              print("Typosquat warnings present — PR requires manual review")
              sys.exit(2)
          PYTHON

  auto-merge:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge community submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto
