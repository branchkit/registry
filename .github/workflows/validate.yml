name: Validate Catalog

# Runs from the BASE branch (pull_request_target), so a pull request cannot
# change the checks it is judged by: editing this file or the script in the
# same pull request has no effect on the run. The pull request's files are
# read as data only: nothing from it is checked out over the workspace or
# executed. A maintainer merges; nothing here merges on its own.
on:
  pull_request_target:
    paths:
      - 'catalog.yaml'
      - 'blocklist.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-yaml

      - name: Read the pull request's catalog and file list as data
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Judge the catalog that would land: GitHub's test merge of the
          # pull request into main, compared with main. The head alone, or a
          # merge base the pull request chooses, would miss an entry main
          # gained since (a second entry under that id would pass).
          if ! git fetch --no-tags origin "refs/pull/${PR}/merge"; then
            echo "error: the pull request does not merge cleanly into main; update it"
            exit 1
          fi
          git show FETCH_HEAD:catalog.yaml > "$RUNNER_TEMP/pr-catalog.yaml"
          git show HEAD:catalog.yaml > "$RUNNER_TEMP/base-catalog.yaml"
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            | jq -s 'add' > "$RUNNER_TEMP/pr-files.json"

      - name: Validate catalog.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          # A deleted fork has no head repo; only a branch of this
          # repository is not a fork.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$REPO" ]; then FROM_FORK=false; else FROM_FORK=true; fi
          FROM_FORK=$FROM_FORK python3 .github/scripts/validate_catalog.py \
            "$RUNNER_TEMP/pr-catalog.yaml" "$RUNNER_TEMP/base-catalog.yaml" \
            "$RUNNER_TEMP/pr-files.json"
