name: "BranchKit Plugin Release"
description: >
  Package, sign, and upload a built BranchKit plugin to a GitHub release.
  Language-agnostic: you build the binary (Go, Rust, Python, anything that
  speaks the plugin protocol); this action does everything after —
  reproducible tarball, checksum, Sigstore attestation, and release upload.
  Call it once per target platform (e.g. in a build matrix).

# Composite action: runs as a step inside YOUR job, so it shares the
# filesystem with your build step. It runs with your repository's OIDC
# identity, so the attestation's certificate names YOUR repo — which is what
# BranchKit's install path checks against your plugin's `publisher` field.
#
# Your job MUST grant these permissions (the action can't grant them itself):
#   permissions:
#     contents: write      # upload release assets
#     id-token: write      # OIDC for keyless signing
#     attestations: write  # record the attestation

inputs:
  binary:
    description: "Path to the built plugin binary for this platform."
    required: true
  goos:
    description: "Target OS label (linux, darwin, windows)."
    required: true
  goarch:
    description: "Target arch label (amd64, arm64)."
    required: true
  tag:
    description: "Release tag to upload to (e.g. the pushed tag)."
    required: true
  plugin-dir:
    description: "Directory containing plugin.json (and collection_data)."
    required: false
    default: "."
  name:
    description: "Plugin short name for the artifact. Defaults to the manifest id."
    required: false
    default: ""
  exclude:
    description: >
      Space-separated top-level names in the plugin directory to leave out of
      the archive, beyond the packager's own list (source, VCS, lock files).
      For build inputs only this repository has, such as `stages` when a
      stage's source lives there and its built binary sits beside plugin.json.
    required: false
    default: ""
  cli-version:
    description: "branchkit-cli release to use for packaging."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install branchkit-cli
      shell: bash
      run: |
        set -euo pipefail
        if command -v branchkit-cli >/dev/null 2>&1; then exit 0; fi
        # The runner's own labels, not uname: on Windows uname names the
        # Unix layer (MINGW64_NT-…), not the OS.
        case "${{ runner.os }}" in
          Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;;
          *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64) arch=amd64 ;; ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: ${{ runner.arch }}" >&2; exit 1 ;;
        esac
        # GitHub serves `latest` at releases/latest/download/ and a tag at
        # releases/download/<tag>/ — the two paths are not symmetric.
        case "${{ inputs.cli-version }}" in
          latest) rel="latest/download" ;;
          *) rel="download/${{ inputs.cli-version }}" ;;
        esac
        url="https://github.com/branchkit/branchkit-cli/releases/${rel}/branchkit-cli-${os}-${arch}.tar.gz"
        # Into the job's temp dir and onto PATH for later steps: no sudo, and
        # the same on every OS. tar runs inside the directory because GNU tar
        # reads a Windows path's drive colon as a remote host.
        dest="$RUNNER_TEMP/branchkit-cli"
        mkdir -p "$dest"
        curl -fsSL "$url" -o "$dest/cli.tar.gz"
        (cd "$dest" && tar -xzf cli.tar.gz && rm cli.tar.gz)
        echo "$dest" >> "$GITHUB_PATH"

    - name: Package
      id: package
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        name_arg=""
        [ -n "${{ inputs.name }}" ] && name_arg="--name ${{ inputs.name }}"
        exclude_args=""
        for e in ${{ inputs.exclude }}; do exclude_args="$exclude_args --exclude $e"; done
        branchkit-cli plugin package "${{ inputs.plugin-dir }}" \
          --binary "${{ inputs.binary }}" \
          --os "${{ inputs.goos }}" --arch "${{ inputs.goarch }}" \
          --out dist $name_arg $exclude_args
        # Resolve the produced tarball name (x86_64 label for amd64).
        arch_label="${{ inputs.goarch }}"; [ "$arch_label" = "amd64" ] && arch_label=x86_64
        base=$(ls dist/branchkit-plugin-*-${{ inputs.goos }}-${arch_label}.tar.gz)
        echo "tarball=$base" >> "$GITHUB_OUTPUT"

    - name: Attest (Sigstore keyless, your repo's identity)
      id: attest
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ steps.package.outputs.tarball }}

    - name: Export the bundle beside the artifact
      shell: bash
      run: |
        set -euo pipefail
        # BranchKit's install path looks for <artifact>.sigstore.json.
        cp "${{ steps.attest.outputs.bundle-path }}" \
           "${{ steps.package.outputs.tarball }}.sigstore.json"

    - name: Upload to the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        t="${{ steps.package.outputs.tarball }}"
        tag="${{ inputs.tag }}"
        # The tag push alone makes no release. Create it on first need; every
        # platform job of the matrix gets here, so losing the race to create
        # it is fine as long as it exists afterwards. A tag with a pre-release
        # suffix (v1.2.0-rc.1) makes a prerelease, which `latest` skips.
        if ! gh release view "$tag" >/dev/null 2>&1; then
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --verify-tag --title "$tag" --notes "" $pre \
            || gh release view "$tag" >/dev/null
        fi
        gh release upload "$tag" \
          "$t" "$t.sha256" "$t.sigstore.json" --clobber
